<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>builds</title>
</head>
<body>
    <h1>submit a build</h1>
    <form action="mailto:fellmad@gmail.com" method="get" enctype="text/plain">
        <p>
            Name:
            <input type="text" id="name" size="30">
        </p>
        <p>
            select a build script
            <br />
            <select id="build_script_name">
                <option>cedar</option>
                <option>cedar sdk</option>
                <option>remove old tip builds</option>
                <option selected>cedar</option>
            </select>
        </p>
        <p>
            comments about the build<br />
            <textarea id="build_comments" rows="5" cols="72"></textarea>
        </p>
        <p>
            <input type="submit" value="submit_button">
            <input type="reset">
        </p>
    </form>
</body>
</html>
